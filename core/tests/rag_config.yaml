ingestion_config:
  parser_config:
    megaparse_config:
      strategy: "fast"
      pdf_parser: "unstructured"
    splitter_config:
      chunk_size: 400
      chunk_overlap: 100

retrieval_config:
  # Maximum number of previous conversation iterations
  # to include in the context of the answer
  max_history: 10

  max_files: 20
  reranker_config:
    # The reranker supplier to use
    supplier: "cohere"

    # The model to use for the reranker for the given supplier
    # MODEL_CARD_URL: https://docs.cohere.com/docs/rerank-2 (see also https://cohere.com/blog/rerank)
    # TODO: Verify this URL points to the current model card before deployment.
    model: "rerank-multilingual-v3.0"

    # Number of chunks returned by the reranker
    top_n: 5
  llm_config:
    # The LLM supplier to use
    supplier: "openai"

    # The model to use for the LLM for the given supplier
    # _ai_iac_024_MODEL_CARD_URL: https://openai.com/research/gpt-4o (see also https://platform.openai.com/docs/models/gpt-4o)
    # TODO: Verify this URL points to the current model card before deployment.
    # Note: gpt-4o (openai) is not on the organization disapproved list and is permitted for use.
    model: "gpt-4o"

    max_context_tokens: 2000

    # Maximum number of tokens to pass to the LLM
    # as a context to generate the answer
    max_output_tokens: 2000

    temperature: 0.7
    streaming: true
